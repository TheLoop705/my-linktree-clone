version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: linkhub-postgres
    environment:
      POSTGRES_USER: linkhub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: linkhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: linkhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO for S3-compatible local storage
  minio:
    image: minio/minio
    container_name: linkhub-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: miniouser
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Create default buckets in MinIO
  createbuckets:
    image: minio/mc
    container_name: linkhub-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 miniouser miniopassword;
      /usr/bin/mc mb myminio/linkhub-uploads;
      /usr/bin/mc anonymous set public myminio/linkhub-uploads;
      exit 0;
      "

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog
    container_name: linkhub-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data: